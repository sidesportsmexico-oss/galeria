<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Proyectos</title>
<style>
  :root{
    --bg:#0b0d10;
    --card:#14171c;
    --border:#242830;
    --accent:#c9a24b;
    --text:#f0f0ee;
    --muted:#9aa0a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
  }
  header{
    padding:60px 24px 30px;
    text-align:center;
  }
  header h1{
    font-size:2.4rem;
    letter-spacing:2px;
    font-weight:300;
    text-transform:uppercase;
  }
  header h1 span{color:var(--accent);}
  header p{
    color:var(--muted);
    margin-top:10px;
    font-size:0.95rem;
    letter-spacing:1px;
  }
  .grid{
    max-width:1200px;
    margin:0 auto;
    padding:20px 24px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .card .thumb{
    width:100%;
    height:220px;
    background:#1b1e24 center/cover no-repeat;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card .thumb video{
    width:100%;height:100%;object-fit:cover;
  }
  .card .thumb .placeholder{
    color:var(--muted);
    font-size:0.85rem;
    letter-spacing:1px;
    text-align:center;
    padding:0 20px;
  }
  .play-badge{
    position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.6);
    color:var(--accent);
    font-size:.7rem;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:1px;
  }
  .card .info{
    padding:18px 20px 22px;
  }
  .card .info h2{
    font-size:1.1rem;
    font-weight:500;
    letter-spacing:.5px;
  }
  .card .info p{
    color:var(--muted);
    font-size:.82rem;
    margin-top:6px;
  }

  /* Modal */
  .modal{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:1000;
    overflow-y:auto;
  }
  .modal.open{display:block;}
  .modal-inner{
    max-width:1000px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  .modal-close{
    position:fixed;top:20px;right:28px;
    font-size:2rem;color:var(--text);
    cursor:pointer;
    z-index:1001;
    line-height:1;
  }
  .modal h2{
    font-size:1.8rem;
    font-weight:300;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .modal h2 span{color:var(--accent);}
  .modal .sub{color:var(--muted);margin-bottom:28px;font-size:.9rem;}
  .modal video{
    width:100%;border-radius:10px;margin-bottom:30px;background:#000;
  }
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
  }
  .photo-grid .ph{
    aspect-ratio:4/3;
    background:#1b1e24;
    border:1px dashed var(--border);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:.75rem;
    text-align:center;
    overflow:hidden;
  }
  .photo-grid .ph img{width:100%;height:100%;object-fit:cover;}
  .section-label{
    margin:30px 0 14px;
    color:var(--accent);
    font-size:.8rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.75rem;
    padding:20px;
    border-top:1px solid var(--border);
  }
  @media(max-width:600px){
    header h1{font-size:1.7rem;}
  }
</style>
</head>
<body>

<header>
  <h1>Galería de <span>Proyectos</span></h1>
  <p>Vallarta · Cabos · Riviera Maya · Cancún</p>
</header>

<div class="grid" id="grid"></div>

<footer>Side Sports · Galería de proyectos</footer>

<div class="modal" id="modal">
  <div class="modal-close" onclick="closeModal()">&times;</div>
  <div class="modal-inner" id="modalInner"></div>
</div>

<script>
const PROJECTS = [
  {
    id:"vidanta-cabos",
    name:"Vidanta Los Cabos",
    location:"Los Cabos, Baja California Sur",
    video:"videos/vidanta.mp4",
    photos:["images/vidanta/vidanta-1.jpg","images/vidanta/vidanta-2.jpg"]
  },
  {
    id:"querencia",
    name:"Querencia Golf Club",
    location:"Los Cabos, Baja California Sur",
    video:"videos/querencia.mp4",
    photos:["images/querencia/querencia-1.jpg","images/querencia/querencia-2.jpg","images/querencia/querencia-3.jpg","images/querencia/querencia-4.jpg"]
  },
  {
    id:"melia-paradisus",
    name:"Meliá Paradisus Cancún",
    location:"Cancún, Quintana Roo",
    video:"videos/melia.mp4",
    photos:[]
  },
  {
    id:"ava-cancun",
    name:"AVA Cancún",
    location:"Cancún, Quintana Roo",
    video:null,
    photos:["images/ava/ava-1.jpg","images/ava/ava-2.jpg","images/ava/ava-3.jpg","images/ava/ava-4.jpg","images/ava/ava-5.jpg","images/ava/ava-6.jpg","images/ava/ava-7.jpg","images/ava/ava-8.jpg","images/ava/ava-9.jpg","images/ava/ava-10.jpg","images/ava/ava-11.jpg","images/ava/ava-12.jpg","images/ava/ava-13.jpg","images/ava/ava-14.jpg","images/ava/ava-15.jpg"]
  }
];

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = PROJECTS.map((p,i)=>`
    <div class="card" onclick="openModal(${i})">
      <div class="thumb">
        ${p.video ? `<video muted loop playsinline src="${p.video}#t=0.5" preload="metadata"></video><span class="play-badge">VIDEO</span>` : (p.photos.length ? `<img src="${p.photos[0]}" style="width:100%;height:100%;object-fit:cover;" alt="${p.name}">` : `<span class="placeholder">Fotos próximamente</span>`)}
      </div>
      <div class="info">
        <h2>${p.name}</h2>
        <p>${p.location}</p>
      </div>
    </div>
  `).join('');
}

function openModal(i){
  const p = PROJECTS[i];
  const modal = document.getElementById('modal');
  const inner = document.getElementById('modalInner');
  inner.innerHTML = `
    <h2>${p.name}</h2>
    <div class="sub">${p.location}</div>
    ${p.video ? `<video controls src="${p.video}"></video>` : ''}
    <div class="section-label">Fotos</div>
    <div class="photo-grid">
      ${p.photos.length ? p.photos.map(src=>`<div class="ph"><img src="${src}" alt="${p.name}"></div>`).join('') : `<div class="ph">Pendiente<br>(fotos por agregar)</div>`}
    </div>
  `;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='auto';
  document.getElementById('modalInner').innerHTML='';
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

renderGrid();
</script>

</body>
</html>
