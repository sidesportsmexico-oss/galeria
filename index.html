<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Proyectos</title>
<style>
  @import url("https://use.typekit.net/kia7gkk.css");
  :root{
    --bg:#000000;
    --card:#111111;
    --border:#242424;
    --accent:#003DFF;
    --text:#ffffff;
    --muted:#8a8a8e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
  }
  header{
    padding:60px 24px 30px;
    text-align:center;
  }
  header h1{
    font-family:"zuume","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:3rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  header h1 span{color:var(--accent);}
  header p{
    color:var(--muted);
    margin-top:10px;
    font-size:0.95rem;
    letter-spacing:1px;
  }
  .grid{
    max-width:1200px;
    margin:0 auto;
    padding:20px 24px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .card .thumb{
    width:100%;
    height:220px;
    background:#1b1e24 center/cover no-repeat;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card .thumb video{
    width:100%;height:100%;object-fit:cover;
  }
  .card .thumb .placeholder{
    color:var(--muted);
    font-size:0.85rem;
    letter-spacing:1px;
    text-align:center;
    padding:0 20px;
  }
  .play-badge{
    position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.6);
    color:var(--accent);
    font-size:.7rem;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:1px;
  }
  .card .info{
    padding:18px 20px 22px;
  }
  .card .info h2{
    font-family:"zuume","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:1.3rem;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  .card .info p{
    color:var(--muted);
    font-size:.82rem;
    margin-top:6px;
  }

  /* Modal */
  .modal{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:1000;
    overflow-y:auto;
  }
  .modal.open{display:block;}
  .modal-inner{
    max-width:1000px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  .modal-close{
    position:fixed;top:20px;right:28px;
    font-size:2rem;color:var(--text);
    cursor:pointer;
    z-index:1001;
    line-height:1;
  }
  .modal h2{
    font-family:"zuume","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:2.2rem;
    letter-spacing:1px;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .modal h2 span{color:var(--accent);}
  .modal .sub{color:var(--muted);margin-bottom:28px;font-size:.9rem;}
  .modal video{
    width:100%;border-radius:10px;margin-bottom:30px;background:#000;
  }
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
  }
  .photo-grid .ph{
    aspect-ratio:4/3;
    background:#1b1e24;
    border:1px dashed var(--border);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:.75rem;
    text-align:center;
    overflow:hidden;
  }
  .photo-grid .ph img{width:100%;height:100%;object-fit:cover;}
  .section-label{
    margin:30px 0 14px;
    color:var(--accent);
    font-size:.8rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.75rem;
    padding:20px;
    border-top:1px solid var(--border);
  }
  @media(max-width:600px){
    header h1{font-size:1.7rem;}
  }

  /* Verticales / Nuestros Lugares (estilo copiado de sidesports.mx) */
  .verticales-section{
    max-width:1400px;
    margin:0 auto;
    padding:60px 24px 100px;
    border-top:1px solid var(--border);
  }
  .verticales-header{
    text-align:center;
    margin-bottom:36px;
  }
  .verticales-header h2{
    font-family:"zuume","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem,4vw,3.2rem);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .verticales-header p{
    color:var(--muted);
    margin-top:10px;
    font-size:.95rem;
  }
  .filter-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:24px;
  }
  .filter-btn{
    background:transparent;
    color:var(--text);
    border:1px solid rgba(255,255,255,.2);
    padding:8px 18px;
    border-radius:99px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:.85rem;
    cursor:pointer;
    transition:all .25s ease;
    white-space:nowrap;
  }
  .filter-btn:hover{border-color:rgba(255,255,255,.6);}
  .filter-btn.active[data-filter="todos"]{background:#003DFF;border-color:#003DFF;box-shadow:0 4px 15px rgba(0,61,255,.35);}
  .filter-btn.active[data-filter="hoteles"]{background:#D4AF37;border-color:#D4AF37;color:#000;box-shadow:0 4px 15px rgba(212,175,55,.35);}
  .filter-btn.active[data-filter="ent"]{background:#D946EF;border-color:#D946EF;box-shadow:0 4px 15px rgba(217,70,239,.35);}
  .filter-btn.active[data-filter="residencial"]{background:#10B981;border-color:#10B981;color:#000;box-shadow:0 4px 15px rgba(16,185,129,.35);}
  .filter-btn.active[data-filter="inmob"]{background:#6366F1;border-color:#6366F1;box-shadow:0 4px 15px rgba(99,102,241,.35);}
  .filter-btn.active[data-filter="clubes"]{background:#F97316;border-color:#F97316;box-shadow:0 4px 15px rgba(249,115,22,.35);}

  .lugares-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
    margin-top:36px;
  }
  .client-card{
    height:240px;
    border-radius:16px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:filter .35s ease, opacity .35s ease;
  }
  .client-card img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .6s cubic-bezier(.25,.46,.45,.94);
  }
  .client-card:hover img{transform:scale(1.08);}
  .client-card.dim{filter:grayscale(1) brightness(.55);opacity:.55;}
  .card-overlay-cl{
    position:absolute;inset:0;
    background:linear-gradient(to bottom, transparent 40%, rgba(0,0,0,.95) 100%);
    pointer-events:none;
  }
  .card-title-cl{
    position:absolute;bottom:16px;left:18px;right:18px;
    margin:0;
    font-family:"zuume","Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:1.05rem;
    text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
  }

  /* Modal de lugares con thumbs */
  .gallery-media{padding:0;display:flex;flex-direction:column;gap:12px;}
  .gallery-main-wrap{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#111;margin-bottom:12px;}
  .gallery-main-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;justify-content:center;}
  .gallery-thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;border:2px solid transparent;opacity:.55;transition:opacity .2s,border-color .2s;}
  .gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-thumb.active{opacity:1;border-color:var(--accent);}
  .vertical-tag{
    display:inline-block;
    margin-bottom:10px;
    padding:4px 12px;
    border-radius:99px;
    font-size:.75rem;
    letter-spacing:1px;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>Galería de <span>Proyectos</span></h1>
  <p>Vallarta · Cabos · Riviera Maya · Cancún</p>
</header>

<div class="grid" id="grid"></div>

<section class="verticales-section">
  <div class="verticales-header">
    <h2>Nuestros <span style="color:var(--accent)">Lugares</span></h2>
    <p>Hoteles, clubes deportivos, desarrollos y centros de entretenimiento donde ya estamos.</p>
    <div class="filter-buttons" id="filters">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="hoteles">Hoteles</button>
      <button class="filter-btn" data-filter="ent">Centros de Ent.</button>
      <button class="filter-btn" data-filter="residencial">Residencial</button>
      <button class="filter-btn" data-filter="inmob">Desarrollo Inmob.</button>
      <button class="filter-btn" data-filter="clubes">Clubes Deportivos</button>
    </div>
  </div>
  <div class="lugares-grid" id="lugaresGrid"></div>
</section>

<footer>Side Sports · Galería de proyectos</footer>

<div class="modal" id="modal">
  <div class="modal-close" onclick="closeModal()">&times;</div>
  <div class="modal-inner" id="modalInner"></div>
</div>

<div class="modal" id="lugarModal">
  <div class="modal-close" onclick="closeLugarModal()">&times;</div>
  <div class="modal-inner" id="lugarModalInner"></div>
</div>

const PROJECTS = [

  },
  {
    id:"melia-paradisus",
    name:"Meliá Paradisus Cancún",
    location:"Cancún, Quintana Roo",
    video:"videos/melia.mp4",
    photos:[]

  {
    id:"ava-cancun",

    video:null,
    photos:["images/ava/ava-1.jpg","images/ava/ava-2.jpg","images/ava/ava-3.jpg","images/ava/ava-4.jpg","images/ava/ava-5.jpg","images/ava/ava-6.jpg","images/ava/ava-7.jpg","images/ava/ava-8.jpg","images/ava/ava-9.jpg","images/ava/ava-10.jpg","images/ava/ava-11.jpg","images/ava/ava-12.jpg","images/ava/ava-13.jpg","images/ava/ava-14.jpg","images/ava/ava-15.jpg"]
  }
];

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = PROJECTS.map((p,i)=>`
    <div class="card" onclick="openModal(${i})">
      <div class="thumb">
        ${p.video ? `<video muted loop playsinline src="${p.video}#t=0.5" preload="metadata"></video><span class="play-badge">VIDEO</span>` : (p.photos.length ? `<img src="${p.photos[0]}" style="width:100%;height:100%;object-fit:cover;" alt="${p.name}">` : `<span class="placeholder">Fotos próximamente</span>`)}
      </div>
      <div class="info">
        <h2>${p.name}</h2>
        <p>${p.location}</p>
      </div>
    </div>
  `).join('');
}

function openModal(i){
  const p = PROJECTS[i];
  const modal = document.getElementById('modal');
  const inner = document.getElementById('modalInner');
  inner.innerHTML = `
    <h2>${p.name}</h2>
    <div class="sub">${p.location}</div>
    ${p.video ? `<video controls src="${p.video}"></video>` : ''}
    ${p.photos.length ? `
    <div class="section-label">Fotos</div>
    <div class="photo-grid">
      ${p.photos.map(src=>`<div class="ph"><img src="${src}" alt="${p.name}"></div>`).join('')}
    </div>` : ''}
  `;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='auto';
  document.getElementById('modalInner').innerHTML='';
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeLugarModal(); } });

renderGrid();

let currentLugaresFilter = "todos";

function renderLugares(){
  const grid = document.getElementById('lugaresGrid');
  grid.innerHTML = LUGARES.map((l,i)=>{
    const dim = currentLugaresFilter!=="todos" && l.category!==currentLugaresFilter;
    return `
    <div class="client-card ${dim?'dim':''}" onclick="openLugarModal(${i})">
      <img src="${l.photos[0]}" alt="${l.name}" loading="lazy">
      <div class="card-overlay-cl"></div>
      <h3 class="card-title-cl">${l.name}</h3>
    </div>`;
  }).join('');
}

document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  currentLugaresFilter = btn.getAttribute('data-filter');
  document.querySelectorAll('#filters .filter-btn').forEach(b=>{
    b.classList.toggle('active', b===btn);
  });
  renderLugares();
});

let currentLugar = null;
let currentLugarPhotoIdx = 0;

function openLugarModal(i){
  currentLugar = LUGARES[i];
  currentLugarPhotoIdx = 0;
  renderLugarModal();
  document.getElementById('lugarModal').classList.add('open');
  document.body.style.overflow='hidden';
}

function renderLugarModal(){
  const l = currentLugar;
  const color = CAT_COLOR[l.category] || 'var(--accent)';
  const inner = document.getElementById('lugarModalInner');
  inner.innerHTML = `
    <span class="vertical-tag" style="background:${color};color:#000">${CAT_LABEL[l.category]}</span>
    <h2>${l.name}</h2>
    <div class="sub">${l.desc}</div>
    <div class="gallery-media">
      <div class="gallery-main-wrap">
        <img id="lugarMainImg" src="${l.photos[currentLugarPhotoIdx]}" alt="${l.name}">
      </div>
      ${l.photos.length>1 ? `<div class="gallery-thumbs">
        ${l.photos.map((src,idx)=>`<div class="gallery-thumb ${idx===currentLugarPhotoIdx?'active':''}" onclick="setLugarPhoto(${idx})"><img src="${src}"></div>`).join('')}
      </div>` : ''}
    </div>
  `;
}

function setLugarPhoto(idx){
  currentLugarPhotoIdx = idx;
  renderLugarModal();
}

function closeLugarModal(){
  document.getElementById('lugarModal').classList.remove('open');
  document.body.style.overflow='auto';
  document.getElementById('lugarModalInner').innerHTML='';
}

renderLugares();
</script>

</body>
</html>
